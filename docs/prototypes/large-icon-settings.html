<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大图标设置 · SnowDesktop 交互草稿</title>
<style>
  :root{color-scheme:light;--bg:#f7f7f8;--side:#f0f1f3;--card:#fff;--text:#202124;--muted:#69717a;--line:#e6e8eb;--accent:#0067c0;--soft:#e5eef7;--control:#fff;--hover:#f4f5f7}
  *{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
  button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}button:disabled,input:disabled,select:disabled{cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover:not(:disabled){background:var(--hover)}
  [hidden]{display:none!important}.caption{height:46px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--side);font-size:13px}.logo{color:var(--accent);font-size:23px}.caption .badge{margin-left:auto;color:var(--muted);font-size:12px}
  .shell{display:grid;grid-template-columns:208px 1fr;height:calc(100dvh - 46px)}aside{background:var(--side);padding:28px 12px 16px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.side-title{font-size:12px;color:var(--muted);padding:0 16px 12px}.nav-item{width:100%;text-align:left;display:flex;align-items:center;gap:12px;border-radius:5px;padding:11px 16px;position:relative;margin-bottom:4px}.nav-item svg{width:18px;height:18px}.nav-item.active{background:#e5e7eb}.nav-item.active:before{content:"";position:absolute;left:0;width:3px;height:18px;border-radius:3px;background:var(--accent)}.side-note{margin-top:auto;padding:20px 16px 0;font-size:12px;color:var(--muted)}
  main{overflow:auto;padding:26px 36px 48px;scrollbar-gutter:stable}.page{max-width:920px;margin:auto}.breadcrumb{display:flex;align-items:center;gap:10px;min-height:34px;margin-bottom:14px;color:var(--muted)}.back{width:32px;height:32px;display:grid;place-items:center;border-radius:5px}.back svg{width:18px;height:18px}.crumb-link{color:var(--accent);padding:3px 0}.sep{color:#9299a0}.heading{margin-bottom:26px}h1{font-size:28px;line-height:1.35;font-weight:600;letter-spacing:-.4px;margin:0}.project{display:flex;align-items:center;gap:8px;color:var(--muted);margin-top:8px}.project-mark{display:inline-grid;place-items:center;width:20px;height:20px;color:white;font-size:11px;border-radius:5px;background:#12b85c}.section{margin-bottom:24px}.section-title{font-size:14px;font-weight:600;margin:0 0 8px 2px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .row{display:grid;grid-template-columns:minmax(180px,1fr) 326px;gap:18px;align-items:center;min-height:54px;padding:10px 16px;border-top:1px solid var(--line)}.card>.row:first-child{border-top:0}.row .label{min-width:0;font-size:14px}.help{color:var(--muted);font-size:12px;line-height:1.45;margin-top:3px}.children{margin-left:18px;border-left:2px solid var(--line)}.children>.row{padding-left:18px}.children>.children{margin-left:18px}.control{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}.select{height:34px;min-width:188px;max-width:100%;padding:0 30px 0 10px;border:1px solid #d6d9dd;border-bottom-color:#979da4;border-radius:5px;background:var(--control)}.restore{width:30px;height:30px;flex-shrink:0;border-radius:4px;display:grid;place-items:center;color:var(--muted)}.restore svg{width:16px;height:16px}.restore:disabled{opacity:.35}
  .numeric{width:100%;display:grid;grid-template-columns:minmax(70px,1fr) 79px 30px;gap:12px;align-items:center}.range{min-width:0;width:100%;height:4px;margin:0;appearance:none;background:linear-gradient(to right,var(--accent) 0 var(--progress),#c4c8ce var(--progress) 100%);border-radius:4px;cursor:pointer}.range::-webkit-slider-thumb{appearance:none;width:18px;height:18px;background:var(--accent);border:4px solid white;border-radius:50%;box-shadow:0 0 0 1px #d7dbe0}.range::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border:3px solid white;border-radius:50%;box-shadow:0 0 0 1px #d7dbe0}.number-wrap{display:flex;align-items:center;background:var(--control);border:1px solid #d6d9dd;border-bottom-color:#969ca4;border-radius:5px;height:33px;padding-right:8px}.number{border:0;outline:0!important;background:transparent;width:100%;min-width:0;padding:5px 3px 5px 9px;appearance:textfield}.number::-webkit-inner-spin-button{appearance:none}.unit{font-size:12px;color:var(--muted)}
  .toggle{position:relative;width:40px;height:21px;flex-shrink:0;padding:0;border:1px solid #777e87;border-radius:20px;background:#fff}.toggle:before{content:"";width:11px;height:11px;border-radius:50%;background:#727a83;position:absolute;left:4px;top:4px;transition:transform .12s}.toggle[aria-checked=true]{background:var(--accent);border-color:var(--accent)}.toggle[aria-checked=true]:before{background:white;transform:translateX(19px)}.toggle:hover:not(:disabled){filter:brightness(.96);background:var(--control)}.toggle[aria-checked=true]:hover:not(:disabled){background:var(--accent)}.disabled .control{opacity:.42}.disabled .label{color:var(--muted)}.state-label{font-size:12px;min-width:26px;color:var(--muted)}
  .action{height:33px;padding:0 13px;border:1px solid #d6d9dd;border-bottom-color:#aeb4bb;border-radius:5px;background:var(--control)}.color-control{gap:8px}.color{width:33px;height:31px;border:1px solid #d6d9dd;border-radius:5px;padding:4px;background:var(--control);cursor:pointer}.color::-webkit-color-swatch-wrapper{padding:0}.color::-webkit-color-swatch{border:0;border-radius:3px}.hex{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:64px;text-align:left}.inline-note{color:var(--muted);font-size:12px;padding:9px 16px 10px 18px;border-top:1px solid var(--line)}.disclosure{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:46px;padding:11px 16px 11px 18px;border-top:1px solid var(--line);font-size:13px}.disclosure svg{width:14px;height:14px;transition:transform .12s}.disclosure[aria-expanded=true] svg{transform:rotate(90deg)}
  .gallery-row{align-items:start}.gallery{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.asset{padding:4px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--muted)}.asset[aria-pressed=true]{border:2px solid var(--accent);padding:3px}.art{width:112px;height:60px;background:linear-gradient(135deg,#192936,#456984 65%,#96acb5);color:#f4f8fa;display:flex;align-items:end;padding:6px;font-size:10px;letter-spacing:1px;border-radius:2px}.art.portrait{width:49px;height:60px;background:linear-gradient(140deg,#223342,#477c86)}.asset-name{display:block;margin-top:3px}.file-name{max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
  .example-row{width:100%;text-align:left;display:flex;align-items:center;gap:16px;background:var(--card);padding:17px 18px;min-height:76px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px}.example-icon{width:40px;height:40px;display:grid;place-items:center;color:#fff;border-radius:9px;background:#12b85c;font-size:18px}.example-row .arrow{margin-left:auto;color:var(--muted)}.example-text{flex:1}.example-text strong{font-weight:500}.example-text small{display:block;color:var(--muted);margin-top:3px;font-size:12px}.intro{color:var(--muted);font-size:13px;margin:12px 0 24px}.footer{font-size:12px;color:var(--muted);padding:0 2px;margin-top:28px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252b33;color:#fff;padding:10px 18px;border-radius:7px;font-size:13px;box-shadow:0 4px 18px #0002;z-index:10;max-width:90vw}.stop-header{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 16px 6px 18px;font-size:12px;color:var(--muted)}.delete{color:#a32424;font-size:12px;border-radius:4px;padding:4px 8px}
  @media(max-width:1160px){.shell{grid-template-columns:176px 1fr}main{padding:24px}.row{grid-template-columns:minmax(160px,1fr) 284px;gap:12px}.numeric{grid-template-columns:minmax(56px,1fr) 75px 30px;gap:9px}}
  @media(max-width:820px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:20px}.page{max-width:760px}}
  @media(max-width:610px){main{padding:16px}.row{grid-template-columns:minmax(108px,1fr) minmax(174px,1.05fr);gap:12px;padding:12px 14px}.control{width:100%;justify-self:end;gap:8px}.children{margin-left:12px}.children>.children{margin-left:12px}.children>.row{padding-left:14px}.select{min-width:0;width:100%;max-width:calc(100% - 34px)}h1{font-size:24px}.heading{margin-bottom:22px}.numeric{grid-template-columns:minmax(32px,1fr) 62px 26px;gap:8px}.restore{width:26px}.gallery-row .control{width:100%}.art{width:98px}.row .label{font-size:13px}}
  @media(max-width:430px){.row{grid-template-columns:1fr;gap:10px}.control{width:min(100%,280px)}.numeric{grid-template-columns:minmax(48px,1fr) 72px 26px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(forced-colors:active){.toggle[aria-checked=true]{background:Highlight}.toggle:before{background:ButtonText!important}.range{background:ButtonText}.range::-webkit-slider-thumb{background:Highlight;border-color:Canvas}.nav-item.active{outline:1px solid Highlight}.children{border-color:GrayText}.disabled .control{opacity:1}}
</style>
</head>
<body>
<header class="caption"><span class="logo" aria-hidden="true">❄</span><span>SnowDesktop 设置</span><span class="badge">交互草稿</span></header>
<div class="shell">
  <aside aria-label="设置导航"><div class="side-title">外观</div><button class="nav-item active" id="icons-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>图标设置</button><button class="nav-item" id="widgets-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 10h18M11 10v11"/></svg>组件背景</button><div class="side-note">示例数据，仅用于确认设置层级。<br>本页操作不会修改桌面。</div></aside>
  <main id="main"><div class="page" id="app"></div></main>
</div>
<div class="notice" role="status" id="notice" hidden></div>
<input type="file" id="file-input" accept=".png,.jpg,.jpeg,.bmp,.ico" hidden>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 5l-7 7 7 7M8 12h13"/></svg>',reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .5 6M4 4v6h6"/></svg>',chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'};
const presets=[['default','默认'],['fill','图标填充'],['follow','跟随组件'],['dark','深色'],['light','浅色'],['glass-dark','毛玻璃深色'],['glass-light','毛玻璃浅色'],['acrylic-dark','亚克力深色'],['acrylic-light','亚克力浅色'],['custom','自定义']];
const examples={wechat:{name:'微信',mark:'微',color:'#12b85c',steam:false,edge:true,shape:'wide',description:'普通图标 · 可识别轮廓底色'},steam:{name:'Steam 游戏',mark:'S',color:'#24435c',steam:true,edge:false,shape:'wide',description:'Steam 示例 · 默认图片填充'},narrow:{name:'窄框图标',mark:'N',color:'#7062ae',steam:false,edge:false,shape:'narrow',description:'无可靠轮廓底色 · 横向标题空间不足'}};
const base={background:'default',smart:true,theme:true,themeOpacity:65,themeGradient:false,themeAngle:90,material:'plain',backgroundColor:'#e8ecf4',opacity:65,gradient:false,startColor:'#b6d6ef',endColor:'#d5c7ef',startOpacity:65,endOpacity:65,angle:90,rangeStart:0,rangeEnd:100,blur:40,border:false,borderColor:'#ffffff',borderOpacity:40,borderWidth:1,highlight:false,highlightStrength:30,highlightWidth:1,radius:12,fillSource:'original',fit:'cover',cropX:50,cropY:50,orientation:'auto',asset:'landscape',localOnly:false,foregroundSource:'original',scale:60,posX:50,posY:50,effect:'none',intensity:30,titleDirection:'left',titleSize:24,titleWeight:600,titleAutoColor:true,titleColor:'#ffffff',fillFile:'',foregroundFile:'',fillRatio:1,foregroundRatio:1};
const stores=Object.fromEntries(Object.keys(examples).map(id=>[id,{...base,...(examples[id].steam?{background:'fill',fillSource:'steam'}:{})}]));
const widgetState={...base,background:'custom'};
let page='large',example='wechat',expanded=false,stopCounter=0,fileTarget=null,noticeTimer,parentScroll=0,returnFocus='wechat';
const stopsByExample={wechat:[],steam:[],narrow:[],widget:[]};
const draftState=()=>page==='widget'?widgetState:stores[example];
const currentDefault=key=>{if(page==='widget'&&key==='background')return 'custom';if(page!=='widget'&&key==='radius')return widgetState.radius;if(page!=='widget'&&examples[example].steam&&key==='background')return 'fill';if(page!=='widget'&&examples[example].steam&&key==='fillSource')return 'steam';if(page!=='widget'&&examples[example].shape==='narrow'&&key==='titleDirection')return 'up';return base[key]};
const stops=()=>stopsByExample[page==='widget'?'widget':example];
const get=(key)=>{if(key.startsWith('stop:')){const [,id,field]=key.split(':');return stops().find(s=>s.id===Number(id))?.[field]}return draftState()[key]};
function defaults(key){if(key.startsWith('stop:')){const field=key.split(':')[2];return field==='color'?'#c8d0ef':field==='opacity'?65:50}return currentDefault(key)}
function restore(key,label,disabled=false){return `<button class="restore" data-reset="${key}" aria-label="恢复${label}默认值" title="恢复默认值" ${disabled||get(key)===defaults(key)?'disabled':''}>${icons.reset}</button>`}
function row(label,control,{help='',disabled=false,id=''}={}){return `<div class="row${disabled?' disabled':''}" ${id?`id="${id}"`:''}><div class="label">${label}${help?`<div class="help">${help}</div>`:''}</div><div class="control">${control}</div></div>`}
function group(content){return content?`<div class="children">${content}</div>`:''}
function slider(label,key,min=0,max=100,unit='%',opts={}){const value=get(key),p=(value-min)/(max-min)*100,step=opts.step||1,dis=opts.disabled?'disabled':'';return row(label,`<div class="numeric"><input type="range" class="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}" style="--progress:${p}%" aria-label="${label}滑杆" ${dis}><label class="number-wrap"><input class="number" type="number" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}数值" ${dis}><span class="unit">${unit}</span></label>${restore(key,label,opts.disabled)}</div>`,opts)}
function toggle(label,key,opts={}){return row(label,`<span class="state-label">${get(key)?'开':'关'}</span><button class="toggle" role="switch" aria-checked="${get(key)}" aria-label="${label}" data-toggle="${key}" ${opts.disabled?'disabled':''}></button>${restore(key,label,opts.disabled)}`,opts)}
function choice(label,key,options,opts={}){const values=options.map(([value,text,disabled=false])=>`<option value="${value}" ${get(key)===value?'selected':''} ${disabled?'disabled':''}>${text}</option>`).join('');return row(label,`<select class="select" data-key="${key}" aria-label="${label}" ${opts.disabled?'disabled':''}>${values}</select>${restore(key,label,opts.disabled)}`,opts)}
function color(label,key){return row(label,`<div class="control color-control"><input class="color" type="color" data-key="${key}" value="${get(key)}" aria-label="${label}"><span class="hex" data-color-label="${key}">${get(key).toUpperCase()}</span>${restore(key,label)}</div>`)}
function actionRow(label,text,action,help=''){return row(label,`<button class="action" data-action="${action}">${text}</button>`,{help})}
function section(title,body,id=''){return `<section class="section" ${id?`id="${id}"`:''}><h2 class="section-title">${title}</h2><div class="card">${body}</div></section>`}
function fileRow(target){const key=target==='fill'?'fillFile':'foregroundFile';return row('本地图片',`${get(key)?`<span class="file-name" title="${escapeHtml(get(key))}">${escapeHtml(get(key))}</span>`:''}<button class="action" data-file="${target}">${get(key)?'更换图片…':'选择图片…'}</button>`)}
function defaultSettings(){const s=draftState(),edge=examples[example].edge&&s.foregroundSource==='original',active=edge&&s.smart;let html='';if(edge)html+=toggle('智能识别填充图标背景色','smart',{help:active?'已识别底色，将使用不透明填充。':''});html+=toggle('使用图标主题色背景','theme');if(s.theme){const opts={disabled:active};let child=slider('背景不透明度','themeOpacity',0,100,'%',{...opts,help:active?'用于主题色回退背景；关闭上方识别后可调。':''});child+=toggle('主题色渐变背景','themeGradient',opts);if(s.themeGradient)child+=slider('渐变角度','themeAngle',0,359,'°',opts);html+=group(child)}return group(html)}
function gradientSettings(){let html=color('起始颜色','startColor')+slider('起始不透明度','startOpacity')+color('终止颜色','endColor')+slider('终止不透明度','endOpacity')+slider('渐变角度','angle',0,359,'°');html+=actionRow('交换颜色','交换起止颜色','swap');html+=`<button class="disclosure" data-action="expand" aria-expanded="${expanded}">更多渐变设置${icons.chevron}</button>`;if(expanded){let advanced=slider('起始位置','rangeStart',0,100,'%')+slider('终止位置','rangeEnd',0,100,'%');for(const [index,stop] of stops().entries()){advanced+=`<div class="stop-header"><span>中间色点 ${index+1}</span><button class="delete" data-delete="${stop.id}" aria-label="删除中间色点 ${index+1}">删除</button></div>`+color('颜色',`stop:${stop.id}:color`)+slider('不透明度',`stop:${stop.id}:opacity`)+slider('位置',`stop:${stop.id}:position`,1,99,'%')}advanced+=row('中间色点',`<button class="action" data-action="add-stop" ${stops().length>=3?'disabled':''}>添加色点</button>`);html+=group(advanced)}return group(html)}
function customSettings(){const s=draftState();let html=choice('材质','material',[['plain','普通'],['glass','毛玻璃'],['acrylic','亚克力']]);if(!s.gradient)html+=color('背景颜色','backgroundColor')+slider('背景不透明度','opacity');if(s.material!=='plain')html+=slider('模糊强度','blur');html+=toggle('启用渐变','gradient');if(s.gradient)html+=gradientSettings();html+=toggle('边框','border');if(s.border)html+=group(color('边框颜色','borderColor')+slider('边框不透明度','borderOpacity')+slider('边框宽度','borderWidth',0,8,'',{step:.5}));html+=toggle('边缘高光','highlight');if(s.highlight)html+=group(slider('高光强度','highlightStrength')+slider('高光宽度','highlightWidth',0,8,'',{step:.5}));return group(html)}
function cropping(){const s=draftState(),frame=examples[example].shape==='narrow'?.75:1.8,source=s.fillSource==='steam'?(s.orientation==='portrait'||s.orientation==='auto'&&s.asset==='portrait'?.67:2.15):s.fillSource==='file'?s.fillRatio:1;return group(slider('左右位置','cropX',0,100,'%',{disabled:source<=frame+.01,help:source<=frame+.01?'图片在横向没有裁切余量。':''})+slider('上下位置','cropY',0,100,'%',{disabled:source>=frame-.01,help:source>=frame-.01?'图片在纵向没有裁切余量。':''}))}
function fillSettings(){const s=draftState();let options=[['original','原始图标'],['file','本地图片']];if(examples[example].steam)options.push(['steam','Steam 背景图']);let html=choice('填充图片来源','fillSource',options);if(s.fillSource==='file')html+=group(fileRow('fill'));if(s.fillSource==='steam'){let steam=choice('素材方向','orientation',[['auto','自动'],['landscape','横向'],['portrait','竖向']]);steam+=row('Steam 素材',`<div class="gallery"><button class="asset" data-asset="landscape" aria-pressed="${s.asset==='landscape'}" aria-label="横向 Steam 示例素材"><span class="art">STEAM · 示例</span><span class="asset-name">横向背景</span></button><button class="asset" data-asset="portrait" aria-pressed="${s.asset==='portrait'}" aria-label="竖向 Steam 示例素材"><span class="art portrait">示例</span><span class="asset-name">竖向素材</span></button></div>`,{help:'本地素材（示例）'});steam+=toggle('仅使用本地素材','localOnly')+actionRow('刷新素材','刷新','refresh');html+=group(steam)}html+=choice('图片适配','fit',[['cover','裁切填充'],['contain','完整显示']]);if(s.fit==='cover')html+=cropping();return group(html)}
function background(){const s=draftState(),options=page==='widget'?presets.filter(([key])=>!['default','fill','follow'].includes(key)):presets;let html=choice('背景样式','background',options);if(s.background==='default')html+=defaultSettings();if(s.background==='fill')html+=fillSettings();if(s.background==='custom')html+=customSettings();if(s.background==='follow')html+=`<div class="inline-note">当前组件背景：${presets.find(([key])=>key===widgetState.background)?.[1]||'自定义'}。圆角独立设置。</div>`;html+=slider('圆角','radius',0,100,'%',{help:'100% 为短边的一半；恢复时采用组件圆角。'});return section('背景',html,'background-section')}
function foreground(){const s=draftState();if(s.background==='fill')return '';let html=choice('图标来源','foregroundSource',[['original','原始图标'],['file','本地图片']]);if(s.foregroundSource==='file')html+=group(fileRow('foreground'));const disabled=s.effect==='title';html+=slider('图标大小','scale',10,100,'%')+slider('左右位置','posX',0,100,'%',{disabled,help:disabled?'动态标题开启时，静止位置由效果居中。':''})+slider('上下位置','posY',0,100,'%',{disabled});return section('图标',html,'foreground-section')}
function effects(){const s=draftState();let html=choice('效果','effect',[['none','无效果'],['3d','3D 效果'],['title','动态标题']]);if(s.effect==='3d')html+=group(slider('效果强度','intensity',0,100,'%',{help:'随鼠标轻微倾斜，并带光影变化。'}));if(s.effect==='title'){const narrow=examples[example].shape==='narrow';html+=group(choice('标题移动方向','titleDirection',[['left','左移，右侧显示标题',narrow],['up','上移，下方显示标题']],{help:narrow?'当前外框较窄，左移方向不可用。':''})+slider('标题字号','titleSize',8,72,'')+slider('标题粗细','titleWeight',100,900,'',{step:100})+toggle('自动标题颜色','titleAutoColor',{help:['default','fill'].includes(s.background)?'自动选择可读颜色。':'默认跟随组件主题前景色。'})+(s.titleAutoColor?'':group(color('标题颜色','titleColor'))))}return section('视觉效果',html,'effects-section')}
function largePage(){const e=examples[example];return `<div class="breadcrumb"><button class="back" data-action="back" aria-label="返回图标设置">${icons.back}</button><button class="crumb-link" data-action="back">图标设置</button><span class="sep">›</span><span>大图标设置</span></div><div class="heading"><h1 tabindex="-1" id="page-heading">大图标设置</h1><div class="project"><span class="project-mark" style="background:${e.color}" aria-hidden="true">${e.mark}</span>${e.name}</div></div>${background()}${foreground()}${effects()}<p class="footer">交互草稿 · 可返回图标设置，切换普通、Steam 或窄框示例。</p>`}
function parentPage(){return `<div class="breadcrumb"><span>外观</span><span class="sep">›</span><span>图标设置</span></div><div class="heading"><h1 tabindex="-1" id="page-heading">图标设置</h1><p class="intro">选择示例项目，查看大图标二级页的设置层级。</p></div><h2 class="section-title">大图标示例</h2>${Object.entries(examples).map(([id,e])=>`<button class="example-row" data-example="${id}" id="example-${id}"><span class="example-icon" style="background:${e.color}" aria-hidden="true">${e.mark}</span><span class="example-text"><strong>${e.name}</strong><small>${e.description}</small></span><span class="arrow">›</span></button>`).join('')}<button class="example-row" data-action="widget"><span class="example-text"><strong>组件背景</strong><small>查看共用的背景与渐变设置</small></span><span class="arrow">›</span></button><p class="footer">仅用于验证导航与条件显示，不代表图标设置父页的完整设计。</p>`}
function widgetPage(){return `<div class="breadcrumb"><button class="back" data-action="back" aria-label="返回图标设置">${icons.back}</button><span>外观</span><span class="sep">›</span><span>组件背景</span></div><div class="heading"><h1 tabindex="-1" id="page-heading">组件背景</h1><p class="intro">与大图标共用自定义背景设置。</p></div>${background()}<p class="footer">交互草稿 · 此处编辑的是组件全局背景示例。</p>`}
function render(){const active=document.activeElement,focus={key:active?.dataset?.key,toggle:active?.dataset?.toggle,action:active?.dataset?.action};$('app').innerHTML=page==='parent'?parentPage():page==='widget'?widgetPage():largePage();$('icons-nav').classList.toggle('active',page!=='widget');$('widgets-nav').classList.toggle('active',page==='widget');const selector=focus.key?`[data-key="${focus.key}"]${active.classList.contains('range')?'.range':''}`:focus.toggle?`[data-toggle="${focus.toggle}"]`:focus.action?`[data-action="${focus.action}"]`:null;if(selector)$('app').querySelector(selector)?.focus({preventScroll:true})}
function showNotice(text){clearTimeout(noticeTimer);$('notice').textContent=text;$('notice').hidden=false;noticeTimer=setTimeout(()=>$('notice').hidden=true,2800)}
function update(key,value,{redraw=true}={}){const s=draftState();if(key.startsWith('stop:')){const [,id,field]=key.split(':');const stop=stops().find(item=>item.id===Number(id));if(stop)stop[field]=value}else{s[key]=value}if(key==='rangeStart'&&s.rangeStart>=s.rangeEnd)s.rangeStart=s.rangeEnd-1;if(key==='rangeEnd'&&s.rangeEnd<=s.rangeStart)s.rangeEnd=s.rangeStart+1;if(key==='effect'&&value==='title'&&examples[example].shape==='narrow'&&s.titleDirection==='left')s.titleDirection='up';if(key==='orientation'&&value!=='auto')s.asset=value;if(redraw)render();else sync(key)}
function sync(key){const value=get(key);document.querySelectorAll('[data-key]').forEach(input=>{if(input.dataset.key!==key)return;input.value=value;if(input.type==='range')input.style.setProperty('--progress',`${(value-Number(input.min))/(Number(input.max)-Number(input.min))*100}%`)});document.querySelectorAll('[data-reset]').forEach(button=>{if(button.dataset.reset===key)button.disabled=value===defaults(key)});document.querySelectorAll('[data-color-label]').forEach(label=>{if(label.dataset.colorLabel===key)label.textContent=String(value).toUpperCase()})}
function openExample(id){if(page==='parent')parentScroll=$('main').scrollTop;page='large';example=id;returnFocus=id;expanded=false;history.pushState({page,example},'',`#${id}`);render();$('main').scrollTop=0;$('page-heading').focus({preventScroll:true})}
function openParent(push=true){page='parent';expanded=false;if(push)history.pushState({page},'','#icons');render();$('main').scrollTop=parentScroll;$(`example-${returnFocus}`)?.focus({preventScroll:true})}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.example){openExample(button.dataset.example);return}if(button.dataset.reset){const key=button.dataset.reset;update(key,defaults(key));return}if(button.dataset.toggle){const key=button.dataset.toggle;update(key,!get(key));return}if(button.dataset.file){fileTarget={target:button.dataset.file,example};$('file-input').value='';$('file-input').click();return}if(button.dataset.asset){draftState().asset=button.dataset.asset;draftState().orientation=button.dataset.asset;render();return}if(button.dataset.delete){const list=stops(),index=list.findIndex(stop=>stop.id===Number(button.dataset.delete));if(index>=0)list.splice(index,1);render();return}switch(button.dataset.action){case 'back':openParent();break;case 'widget':openWidget();break;case 'expand':expanded=!expanded;render();break;case 'swap':{const s=draftState();[s.startColor,s.endColor]=[s.endColor,s.startColor];[s.startOpacity,s.endOpacity]=[s.endOpacity,s.startOpacity];render();break}case 'add-stop':if(stops().length<3){stops().push({id:++stopCounter,color:'#c8d0ef',opacity:65,position:50});render()}break;case 'refresh':showNotice(draftState().localOnly?'已重新读取本地示例素材。':'示例素材已刷新；草稿不会连接 Steam。');break}});
document.addEventListener('input',event=>{const input=event.target;if(!input.dataset.key)return;if(input.type==='range')update(input.dataset.key,Number(input.value),{redraw:false});else if(input.type==='number'&&Number.isFinite(input.valueAsNumber)&&input.validity.valid)update(input.dataset.key,input.valueAsNumber,{redraw:false});else if(input.type==='color')update(input.dataset.key,input.value,{redraw:false})});
document.addEventListener('change',event=>{const input=event.target;if(!input.dataset.key)return;if(input.type==='number'){if(!Number.isFinite(input.valueAsNumber)){sync(input.dataset.key);return}const step=Number(input.step)||1,value=Math.round(Math.min(Number(input.max),Math.max(Number(input.min),input.valueAsNumber))/step)*step;update(input.dataset.key,Number(value.toFixed(3)),{redraw:false})}else if(input.tagName==='SELECT')update(input.dataset.key,input.value)});
$('file-input').addEventListener('change',event=>{const file=event.target.files[0];if(!file||!fileTarget)return;const {target,example:id}=fileTarget,model=stores[id],nameKey=target==='fill'?'fillFile':'foregroundFile',ratioKey=target==='fill'?'fillRatio':'foregroundRatio';model[nameKey]=file.name;const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{if(model[nameKey]===file.name)model[ratioKey]=image.width/image.height;URL.revokeObjectURL(url);if(page==='large'&&example===id)render()};image.onerror=()=>{URL.revokeObjectURL(url);showNotice('无法读取图片；请使用 PNG、JPEG、BMP 或 ICO。')};image.src=url;render()});
function openWidget(){page='widget';expanded=false;history.pushState({page},'','#widgets');render();$('main').scrollTop=0;$('page-heading').focus({preventScroll:true})}
$('icons-nav').onclick=()=>openParent();$('widgets-nav').onclick=openWidget;
window.addEventListener('popstate',event=>{page=event.state?.page||'parent';example=event.state?.example||example;expanded=false;render()});
document.addEventListener('keydown',event=>{if(event.altKey&&event.key==='ArrowLeft'&&page!=='parent'){event.preventDefault();openParent()}});
const initial=location.hash.slice(1);history.replaceState({page:'parent'},'','#icons');if(initial==='icons')page='parent';else if(initial==='widgets'){page='widget';history.pushState({page},'','#widgets')}else{if(examples[initial])example=initial;history.pushState({page:'large',example},'',`#${example}`)}render();
</script>
</body>
</html>
