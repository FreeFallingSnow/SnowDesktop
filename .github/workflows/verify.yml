name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Release targets
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_entry.ps1 -Action ide

      - name: Run core CTest suite
        run: scripts/test.bat core
