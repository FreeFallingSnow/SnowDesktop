name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset tests

      - name: Build Release targets
        run: cmake --build --preset release

      - name: Build core test targets
        run: cmake --build --preset core-tests

      - name: Run core CTest suite
        run: ctest --preset core-tests
